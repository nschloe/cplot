[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# previously flake8 (E, W, F, B, C90) and isort (I)
select = ["E", "W", "F", "B", "C90", "I"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[project]
name = "cplot"
authors = [{name = "Nico Schlömer", email = "nico.schloemer@gmail.com"}]
description = "Plot complex-valued functions"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Matplotlib",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "matplotx[all] >= 0.3.10",
  "numpy >= 1.20.0",
]

[project.optional-dependencies]
all = [
  "meshzoo",
  "pyvista",
]

[dependency-groups]
test = [
  "mpmath",
  "pytest",
  "pytest-codeblocks >= 0.15.0",
  "pytest-cov",
  "pytest-randomly",
  "scipy",
]

[tool.setuptools.dynamic]
version = {attr = "cplot.__about__.__version__"}

[project.urls]
Code = "https://github.com/nschloe/cplot"
Issues = "https://github.com/nschloe/cplot/issues"
Funding = "https://github.com/sponsors/nschloe"

[tool.pytest.ini_options]
# the README code blocks call plt.show(); tests render with Agg (see tests/conftest.py)
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive:UserWarning"]

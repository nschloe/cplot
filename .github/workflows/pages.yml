name: pages

# Regenerate the README figures and publish them to https://nschloe.github.io/cplot/

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pyvista/setup-headless-display-action@v4
      - name: Generate figures
        run: |
          uv run --group figures --extra all python tests/generate-readme-figures.py
          cp assets/* plots/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: plots

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
